<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Search for Steve — 3D WebGL Remaster & Homage (Chaotic Order / TG97)</title>
    <meta name="description" content="Interactive 3D WebGL remaster and demoscene tribute to 'The Search for Steve' (TG97) by Chaotic Order. Features real-time trueSpace .COB parsing, camera spline interpolation, and dual-mode retro/cyberpunk rendering.">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- 3D Canvas Viewport -->
    <div id="viewport"></div>

    <!-- UI Overlay / HUD -->
    <div id="ui-overlay">
        <!-- Top Navigation Header -->
        <header>
            <div class="brand">
                <h1>TSFS <span>The Search for Steve</span></h1>
                <div id="scene-title"><span>Scene:</span> Chaotic Order 3D Logo</div>
            </div>
            <div class="header-actions">
                <button id="mode-btn" title="Toggle between 1997 Retro VGA and Modern Cyberpunk Remaster">⚡ Modern</button>
                <button id="freecam-btn" title="Toggle Free-Cam Mode (Fly with WASD + Mouse, Spacebar)">🎥 Auto-Spline</button>
                <button id="mute-btn" title="Mute / Unmute Audio">🔊</button>
            </div>
        </header>

        <!-- Audio FFT Spectrum Visualizer -->
        <canvas id="visualizer" width="140" height="40"></canvas>

        <!-- Bottom Timeline & Control Bar -->
        <footer>
            <div class="timeline-row">
                <button id="play-btn" class="play-toggle" title="Play / Pause (Hotkey: K)">▶</button>
                <div id="progress-bar" title="Click to seek timeline">
                    <div id="progress-filled"></div>
                </div>
                <div id="time-display">00:00 / 04:39</div>
            </div>
            <!-- Scene Quick Jump Pills -->
            <div class="scene-pills">
                <button class="scene-jump-btn" data-time="0">1. 3D Logo</button>
                <button class="scene-jump-btn" data-time="50">2. Box Matrix</button>
                <button class="scene-jump-btn" data-time="115">3. 3D Toruses</button>
                <button class="scene-jump-btn" data-time="185">4. Road Journey</button>
                <button class="scene-jump-btn" data-time="230">5. Video Cube</button>
                <button class="scene-jump-btn" data-time="265">6. Steve Tribute</button>
            </div>
        </footer>
    </div>

    <!-- Loading Screen -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="color: #00ffcc; font-family: monospace; letter-spacing: 0.1em;">INITIALIZING CHAOTIC ORDER 3D ENGINE...</p>
    </div>

    <!-- Main Module Entry -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
